name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the container-free checks run here. The Godot test suite deliberately
# cannot: .gitignore excludes assets/, so a fresh checkout has neither the
# original game files nor the converted ones, and every scene test needs them.
# Run `make godot-test` locally for that half.

jobs:
  architecture:
    name: architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # First, because a passing architecture check only means something if the
      # checker still fails on the rules it claims to enforce.
      - name: Checker self-test
        run: python3 tools/test_check_architecture.py

      - name: Architecture rules
        run: python3 tools/check_architecture.py

  gdlint:
    name: gdlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same version the Godot container pins, so CI and `make lint` cannot
      # disagree about what is a lint error.
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.3.4"

      - name: gdlint
        run: gdlint scripts tests converters
