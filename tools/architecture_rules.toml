# Architecture rules enforced by tools/check_architecture.py.
#
# A *zone* is a set of files described by glob patterns. A *rule* forbids
# something inside exactly one zone. Rules live here as data so that adding one
# is a few lines plus a fixture in tests/architecture/; only rules that need
# real analysis (see `kind`) carry code in the checker.
#
# Every rule must say `why` and `instead`, and both are printed on a violation.
# A rule whose message does not say what to do instead gets worked around
# blindly, which is worse than having no rule at all.
#
# Escape hatch: append to the offending line
#
#     # arch-allow: <rule-id>[,<rule-id>...] — <reason>
#
# The reason is mandatory (8 characters minimum), hatches are counted against
# `allow_budget` below, and a hatch on a line that does not actually violate
# its rule is itself reported. Accepted separators between ids and reason are
# `—`, `--` and `:`.

[settings]
# Total `# arch-allow:` comments permitted under scripts/. Ratchet this down as
# hatches are removed, never up — the same idiom as `max-file-lines` in
# .gdlintrc. The checker prints the live count on every run and suggests
# lowering the budget when the tree is cleaner than the budget allows.
#
# Raised 0 → 2 in slice R4a, the only time it has moved up, and the trade is
# worth stating because "never up" is the rule it breaks.
# global-position-read-bypasses-store exempts by *file*.
# unit_navigation_system.gd migrated 12 of its 14 reads in R4 and kept 2 view
# reads in _refresh_navigation_debug(), which under a file-level exemption
# took the whole 1100-line simulation facade out from under the rule --
# measured: reverting any of the 12 migrated reads left the checker green,
# while the same revert in each of R4's other six files was caught. Two
# line-scoped hatches buy the file back. A hatch that stops violating its rule
# is itself reported, so these cannot rot silently the way the file entry
# could.
allow_budget = 2

# Minimum length of a hatch reason, in characters.
min_reason_length = 8


# ---------------------------------------------------------------------------
# Zones
# ---------------------------------------------------------------------------

[zones.all]
description = "Every runtime script. tests/ is not scanned and may reach into internals."
include = ["scripts/**/*.gd"]

[zones.sim]
description = """
The deterministic simulation layer. Every client in a lockstep match runs this \
code and must reach a bit-identical result, so it may not touch engine frame \
timing, the scene tree, unseeded randomness, wall-clock time, threads or \
non-portable math. See docs/architecture/network-multiplayer.md.
"""
include = ["scripts/sim/**/*.gd"]


# ---------------------------------------------------------------------------
# Module boundary rules
# ---------------------------------------------------------------------------

[[rules]]
id = "private-owner-access"
zone = "all"
pattern = '\b(?:_facade|_owner|_unit|_source)\._\w+'
summary = "module reaches into its owner's private member"
why = """
A module that reads its owner's underscore-prefixed members is coupled to the \
owner's internals, so the owner can no longer change them safely.
"""
instead = "widen the owner's public API deliberately, then call that"

[[rules]]
id = "facade-sibling-access"
zone = "all"
pattern = '''\b_facade\.(?:runtime_map|planner|avoidance|registry|spatial_hash|slot_allocator|path_follower|path_funnel|blocker_tracker|ground_navigation|air_navigation)\b'''
summary = "navigation sibling reached through the facade"
why = "the facade is not a directory of its siblings; module-to-module wiring through it hides the real dependency graph"
instead = "take the collaborator as a constructor argument, or route the call through the facade's own API"

[[rules]]
id = "direct-autoload-lookup"
zone = "all"
kind = "forbid-in-strings"
pattern = '''\bget_node_or_null\s*\(\s*["']/root/(?:Players|Cursors)["']'''
exempt = ["scripts/players/autoload_lookup.gd"]
summary = "autoload fetched by hardcoded /root path"
why = "a scattered hardcoded path breaks silently when an autoload is renamed or when a scene runs standalone in a test"
instead = "AutoloadLookup, which is the single place allowed to know these paths"

[[rules]]
id = "own-tick-rate"
zone = "all"
pattern = '(?:TICKS_PER_SECOND|_TICK_RATE)\s*:=\s*[0-9]'
exempt = [
	"scripts/sim/match_clock.gd",
	"scripts/rules/rule_ticks.gd",
]
summary = "module declares its own tick rate"
why = """
Phase 1 spent itself collapsing five of these back into one. A literal rate \
next to a countdown is how a fourth tick domain appears without anyone \
deciding to add one, and decision 4 promises that re-testing a different rate \
is a one-constant change. The pattern covers both spellings seen so far -- \
a `TICKS_PER_SECOND` and a `_TICK_RATE` literal -- because NAVIGATION_TICK_RATE \
was exactly this violation under the second spelling, and the first pattern \
here did not catch it.
"""
instead = "MatchClock.TICKS_PER_SECOND for simulation time, or RuleTicks for a rate or duration authored in the rules data itself"

[[rules]]
id = "animation-completes-simulation"
zone = "all"
pattern = 'func _?on_animation_finished\s*\('
exempt = [
	# Phase 4's audit backlog. Every entry here handles AnimationPlayer's
	# animation_finished signal, which fires on engine frame time. Where that
	# handler completes *simulation* state, how many ticks something takes
	# depends on how fast the machine ran -- slice B3d removed exactly that
	# from UnitFlightController, and tests/units/flight_run.gd now proves the
	# severing directly. These have NOT been audited the same way. Each needs
	# the same question answered before phase 4's determinism gate: does it
	# read live animation state to decide *when, or whether*, something
	# happens? Reading a clip's authored length once is fine; waiting on its
	# finished signal is not. Delete the entry when its file is fixed or
	# cleared -- an emptying list is the progress report.
	#
	# Proven defective (see the phase 3 entry, slice B3d's sweep):
	"scripts/units/unit_locomotion.gd",
	# Suspected, unaudited -- each gates something a command can observe:
	"scripts/units/unit_combat.gd",
	"scripts/units/unit_deploy_state.gd",
	"scripts/buildings/building_sale_service.gd",
	# The dispatcher, not a decision of its own: it routes to the handlers
	# above and must survive them, so it is cleared only when they all are.
	"scripts/units/unit.gd",
	# Cosmetic, audited and cleared: picks the next idle clip and nothing else.
	"scripts/units/unit_idle_animations.gd",
]
summary = "simulation state completed from an animation signal"
why = """
AnimationPlayer's animation_finished fires on engine frame time, so a \
transition that completes on it takes however many simulation ticks the \
machine's frame rate happened to allow. Flight had this and it was \
measurable: tests/units/flight_run.gd reported 253 or 254 assertions across \
identical runs until slice B3d severed it. Worse, moving a system onto the \
tick can *hide* the symptom while leaving the cause -- a stable green suite \
then says something about the fixture, not about the code.
"""
instead = "read the clip's authored length once (flight_clip_length()) and complete on a tick deadline, the way UnitFlightController.advance() does since slice B3d"

[[rules]]
id = "global-position-bypasses-store"
zone = "all"
# `global_transform` was added to the alternation by slice R2. Until then this
# pattern said `global_position` only, and a whole-transform write was simply
# invisible to it -- see the MatchSnapshot entry in the exempt list below for
# the defect that blindness was hiding, and the design doc's R2 paragraph.
pattern = '\b(?:\w+\.)?global_(?:position|transform)(?:\.[xyz])?\s*[-+]?=(?!=)'
exempt = [
	# The sanctioned mirror-write chokepoint itself. Unit.set_simulation_position()
	# (its own doc comment) is the one place slice C2 permits a direct write --
	# every other unit write site now calls it instead. Exempting the whole
	# file, not a hatch on the one line: the dispatcher-must-survive-its-own-
	# handlers shape animation-completes-simulation's own exempt list already
	# uses for this exact file, for the identical reason -- a file-level rule
	# cannot tell "the one sanctioned writer" from "a future accidental one"
	# any more precisely than that rule can.
	"scripts/units/unit.gd",
	# The same chokepoint for the other kind, added by slice R1:
	# Building.set_simulation_position() (its own doc comment) is now the one
	# place a building's position may be written, and both of C2's building
	# write sites route through it. Exempted as a whole file for the reason
	# unit.gd is, not because anything else in it writes a position -- nothing
	# does.
	"scripts/buildings/building.gd",
	# Units caught in a footprint that is not (yet, or ever) a Unit -- nothing
	# in this project puts a non-Unit Node3D in the "units" group today, but
	# this function has never assumed only Units reach it (see its own
	# comment) -- fall back to a direct write. The guarded branch above it
	# routes every real Unit through set_simulation_position().
	"scripts/buildings/unit_push_aside.gd",
	# Placement preview meshes (the footprint cell markers and the facing
	# arrow), plus one fallback for a placed scene whose root is not a
	# Building at all -- tests/buildings/placement_run.gd packs a bare Node3D
	# and this file has never assumed otherwise. The building write itself is
	# gone from this list's reason: since slice R1 it routes through
	# Building.set_simulation_position(). match.gd left this list entirely in
	# the same slice, its _place_on_map() building loop now doing what the
	# unit loop directly below it already did.
	"scripts/buildings/building_placement.gd",
	# A wall-preview marker: presentation only, not a simulated entity.
	"scripts/buildings/wall_line_session.gd",
	# The RTS camera. Never a unit, explicitly called out in the design doc's
	# C2 paragraph as an exemption rather than a violation.
	"scripts/world/camera/rts_camera.gd",
	# A spice mound's one-time placement at spawn -- not a unit, and not
	# migrated by this slice; C1-C4's hot-state arrays cover position, health
	# and owner for units only so far (see entity_state.gd's own doc comment).
	"scripts/world/map/map_spice_layer.gd",
	# Cosmetic audio emitter placement -- the view layer, not the simulation.
	"scripts/audio/death_sound_player.gd",
	# Combat projectiles and linger effects are sim-tick-driven entities that
	# deliberately never get an entity id, so there is no store entry for
	# their position to bypass. This is a decision, not a backlog entry --
	# C2's own wording here used to call it "real, scheduled work", and slice
	# R1 settled it the other way: SimEntityRegistry never reuses an id and
	# every SimEntityState array is indexed by id, so tens of thousands of
	# short-lived projectiles per match would grow those arrays without bound
	# at ~44 bytes per id. Their position is already written only from
	# sim_tick(). How they get into a snapshot is phase 5's question. See
	# docs/architecture/network-multiplayer.md, phase 3's R1 paragraph.
	"scripts/combat/combat_projectile.gd",
	"scripts/combat/combat_linger_effect.gd",
	# Pure cosmetic VFX/particles/impact debris -- the view layer's own
	# instant feedback, never read back by the simulation.
	"scripts/combat/combat_impact_effect.gd",
	"scripts/combat/fx/authored_fx_bank.gd",
	"scripts/combat/fx/impact_debris.gd",
	"scripts/combat/turret/combat_turret_fx.gd",
	# --- Below here: exempted when slice R2 widened the pattern to
	# `global_transform`. None of these was newly written; each is a whole-
	# transform write that the `global_position`-only pattern simply could not
	# see. All but one are view-layer nodes that were never entities and never
	# will be -- a ground decal placed on the terrain it scorched, a laser beam
	# spanning muzzle to impact, a corpse stamped into world space after
	# add_child(), two navigation debug overlays, a unit's authored collision
	# shape copied off the converted model, and the map's directional sun.
	"scripts/combat/combat_ground_decal.gd",
	"scripts/combat/fx/laser_beam.gd",
	"scripts/effects/death_corpse.gd",
	"scripts/units/navigation/navigation_grid_debug.gd",
	"scripts/units/navigation/unit_navigation_debug.gd",
	"scripts/units/unit_authored_collision.gd",
	"scripts/world/map/map_loader.gd",
	# Sanctioned, and no longer the backlog item R2 left here.
	# MatchSnapshot._restore_entities() writes `entity.global_transform`
	# because that is the only way to restore an entity's *rotation* --
	# SimEntityState holds a position and nothing else. Until R2b the line
	# stopped there, and the store never learned about a restored entity at
	# all: _register_entity_id() pushes owner, not position, so has_position()
	# answered false for something standing in plain sight and slice B4's
	# interpolation skipped it. It had survived slice C2's migration precisely
	# because that pattern said `global_position` while this line says
	# `global_transform` -- the same write under a second spelling, which is
	# why R2 widened the pattern. R2b pushes the landed position straight back
	# through set_simulation_position(), so the write below is now followed by
	# the store write it used to skip, and this entry exempts the rotation
	# assignment rather than a defect. See
	# docs/architecture/network-multiplayer.md, phase 3's R2b paragraph.
	"scripts/match/match_snapshot.gd",
]
summary = "global_position or global_transform written directly instead of through SimEntityState"
why = """
Decision 3 makes the simulation's hot-state store authoritative for a unit's \
or a building's position and the node a mirror of it. A direct write that \
bypasses the store diverges from it silently, and the mirror makes that \
divergence look correct right up until a snapshot or a checksum disagrees -- \
the store keeps answering with the value it was last told, not the value the \
node actually holds. `global_transform` is the same write under a second \
spelling and is matched for that reason: writing it moves the node exactly as \
writing `global_position` does, and slice R2 found one such write (see \
MatchSnapshot in the exempt list) that had been invisible to this rule since \
C2. See docs/architecture/network-multiplayer.md, phase 3's C2 paragraph for \
units, its R1 paragraph for buildings and its R2 paragraph for the widened \
pattern.
"""
instead = "Unit.set_simulation_position(value) or Building.set_simulation_position(value), which write SimEntityState first and mirror the result into global_position"

[[rules]]
id = "global-position-read-bypasses-store"
zone = "all"
# Qualified reads only: `X.global_position`, one system asking where *another*
# entity is. A bare `global_position` -- a node reading its own mirror -- is a
# different and much smaller question and is deliberately not matched; see
# `why`. The negative lookahead is this rule's half of a partition with
# global-position-bypasses-store above: it mirrors that rule's own assignment
# tail (`(?:\.[xyz])?\s*[-+]?=(?!=)`) exactly, so every `X.global_position = v`,
# `X.global_position.y = v` and `X.global_position += v` is reported there, by
# the write rule, and never twice. `==`, `!=`, `<=` and `>=` survive the
# lookahead and stay reads, which they are. The leading character class also
# accepts `)` and `]` so that `(candidate as Node3D).global_position` and
# `agents[i].global_position` are not a way around the rule.
pattern = '[\w)\]]\.global_(?:position|transform)\b(?!(?:\.[xyz])?\s*[-+]?=(?!=))'
exempt = [
	# ===================================================================
	# PERMANENT -- 20 files, 35 reads (re-measured in slice R5 with the rule's
	# own pattern). This header said 21 files and 37 reads until then, which
	# was R4's own correct count and went stale the same day: R4 moved
	# unit_navigation_system.gd across from the queued group for the 2 view
	# reads it left behind, and R4a took that file back out again in favour of
	# two line-scoped hatches without lowering the total it had just been
	# added to. The file and its 2 reads are therefore in neither group now --
	# 41 files match the rule, 20 here, 20 queued, and unit_navigation_system.gd
	# alone with its hatches. These should keep asking the node
	# forever and are not work anyone owes. Three reasons cover all of them,
	# and none is a scheduling excuse:
	#
	#  1. The reader is view code. A camera unproject, an FX or debris
	#     emitter, a positional audio emitter, a UI halo, a debug overlay, a
	#     corpse or death sequence, a wall's mesh-variant choice: all of it
	#     runs on frame time and produces pixels or sound, never a number the
	#     tick reads back. Asking the store there would buy nothing and would
	#     make the view lag the mirror it is drawing.
	#  2. The thing being read deliberately has no store entry. Projectiles,
	#     linger effects and spice mounds never get entity ids -- that is a
	#     decision, recorded in the write rule's exempt list above and in the
	#     design doc's R1 paragraph -- so there is no stored position for a
	#     reader to prefer.
	#  3. The read is of a rotation, not a position. `global_transform.basis`
	#     and `global_transform.affine_inverse()` ask for orientation, and
	#     SimEntityState holds no rotation at all (see its own doc comment):
	#     position, health, shields and owner. There is nothing to migrate to.
	#
	# Exemption is by file, which is coarser than the reasons above: a few of
	# these are simulation files whose *only* qualified read happens to be an
	# audio or FX emitter placement (authored_fire_controller.gd,
	# unit_deploy_state.gd, unit_movement_sounds.gd). Their entry buys silence
	# for a future simulation read too. That is the same imprecision the write
	# rule already accepts for unit.gd and building.gd, and for the same
	# reason: a file-level rule cannot tell a sanctioned read from a future
	# accidental one any more precisely than this.
	"scripts/buildings/building_construction_sound.gd",
	"scripts/buildings/building_death_sequence.gd",
	"scripts/buildings/building_wall_visual.gd",
	"scripts/combat/authored_fire_controller.gd",
	"scripts/combat/combat_ground_decal.gd",
	"scripts/combat/combat_projectile.gd",
	# Both arrived from the queued group in slice R6, and neither holds a
	# simulation read of an entity. combat_turret.gd's eight are muzzle and
	# pivot transforms, the launch-smoke marker, the model root, a projectile
	# (which by R1's decision has no entity id at all) and one dead fallback;
	# combat_target.gd's one is the twin of that fallback. Both fallbacks reach
	# a Node3D only when the object offers neither combat_aim_position_from()
	# nor combat_aim_position(), which every Unit and Building does -- so for a
	# real entity the line never runs, and for anything else there is no store
	# entry it could read instead.
	"scripts/combat/combat_target.gd",
	"scripts/combat/combat_turret.gd",
	"scripts/combat/fx/impact_debris.gd",
	"scripts/combat/turret/combat_turret_fx.gd",
	"scripts/match/unit_command_controller.gd",
	# MatchSnapshot._capture_entity() saves `entity.global_transform` rather
	# than the store's position. Permanent rather than queued, decided with the
	# tool's owner in slice R2b: F7/Shift+F7 snapshots are a throwaway debug
	# convenience whose files are expected to be lost, and a real save/load
	# system supersedes the whole file later -- migrating this read would buy
	# nothing that survives that. The read is also correct as it stands, since
	# inside a match the node's transform is the store's own mirror; what was
	# actually broken was the restore side, and R2b fixed that rather than
	# documenting it.
	"scripts/match/match_snapshot.gd",
	"scripts/ui/selection_halo_binding.gd",
	"scripts/units/navigation/navigation_grid_debug.gd",
	"scripts/units/unit_authored_collision.gd",
	"scripts/units/unit_death_sequence.gd",
	"scripts/units/unit_deploy_state.gd",
	"scripts/units/unit_movement_sounds.gd",
	"scripts/world/authored_model.gd",
	"scripts/world/camera/rts_camera.gd",
	"scripts/world/map/map_spice_layer.gd",
	"scripts/world/spatial_orientation.gd",
	#
	# ===================================================================
	# QUEUED -- 20 files, 53 reads, down from 22 files and 77 before slice R5
	# took the flight group. Simulation code that should ask SimEntityState and
	# does not yet. The slices after R5 empty this half one subsystem at a time;
	# deleting a line is the visible event that records progress, exactly as it
	# is for animation-completes-simulation. The counts are what make this a
	# plan rather than a list: navigation was two thirds of the debt at 12 files
	# and 103 reads when R3 started, and is now gone from this half entirely --
	# R3 took ground steering, R4 the system-and-shared group, R5 flight. Combat
	# is what is left of the large groups.
	#
	# Combat -- gone from this half in slice R6. Four files migrated, plus the
	# two combat_aim_position() accessors this rule never saw at all because an
	# entity reading its own position is a bare read -- see the R6 paragraph in
	# the design doc. The remaining two moved up to PERMANENT rather than being
	# migrated: their reads are of markers, pivots, projectiles and dead
	# fallbacks, none of which has a store entry to read from.
	# Buildings -- 5 files, 11 reads. Rally points, refinery docks, footprint
	# cells and survivor spawns, all derived from a building's own position.
	"scripts/buildings/building_rally_point.gd",  # 6
	"scripts/buildings/building_refinery_docks.gd",  # 2
	"scripts/buildings/building_footprint.gd",  # 1
	"scripts/buildings/building_survivors.gd",  # 1
	"scripts/buildings/unit_push_aside.gd",  # 1
	# Units -- 5 files, 16 reads. Transport docking, terrain snapping,
	# deployment and production exits, plus Unit's own single qualified read
	# (a carryall's pickup target).
	"scripts/units/advanced_carryall_transport.gd",  # 6
	"scripts/units/unit_terrain_alignment.gd",  # 5
	"scripts/units/unit_deployment_controller.gd",  # 2
	"scripts/units/unit_roster_controller.gd",  # 2
	"scripts/units/unit.gd",  # 1
	# Match and world -- 4 files, 7 reads. Command execution, the carryall
	# ability's nearest-candidate search, the snap-to-ground seeding loop in
	# Match._place_on_map(), and spice hazard damage. match_snapshot.gd used to
	# be counted here for its read half; slice R2b moved it up to the permanent
	# group instead -- see its entry there.
	"scripts/match/advanced_carryall_ability.gd",  # 2
	"scripts/match/match.gd",  # 2
	"scripts/world/map/map_spice_hazard.gd",  # 2
	"scripts/match/command_executor.gd",  # 1
	#
	# Migrated and gone from this list, which is the point of keeping it:
	# scripts/units/harvester_controller.gd (7 reads), by slice R2 itself;
	# scripts/units/navigation/ground/ground_slot_allocator.gd (23),
	# ground_navigation.gd (20) and steering_stabilizer.gd (10), by slice R3 --
	# the whole ground-navigation group, every read of it simulation;
	# shared/nav_agent_registry.gd (3), shared/nav_blocker_tracker.gd (2),
	# ground/orca_avoidance.gd (2), ground/ground_path_follower.gd (2),
	# ground/attack_arc_allocator.gd (2) and shared/nav_spatial_hash.gd (1), by
	# slice R4, which also took 12 of unit_navigation_system.gd's 14 and moved
	# that file to the permanent group for the 2 view reads it left behind;
	# unit_flight_controller.gd (21) and air/air_navigation.gd (3), by slice R5
	# -- the flight group, every read of it simulation, which empties the
	# navigation subgroup of this list.
]
summary = "another entity's position read off the node instead of SimEntityState"
why = """
Decision 3 makes the store authoritative and the node a mirror, and slices C2 \
and R1 delivered only the write half: readers still ask the node, so the \
design's promise is kept by convention at every call site rather than by \
structure. A mirror answers plausibly right up until it is stale, and B4 made \
staleness real rather than theoretical -- the view already moves on frame time \
between ticks, so anything that starts blending the node's own transform feeds \
a frame-rate-dependent number straight back into the simulation. \
This rule matches **qualified** reads only, and that is a measurement rather \
than a compromise. Measured across scripts/**/*.gd when R2 was written: 195 \
qualified `X.global_position` reads in 49 files, plus 24 qualified \
`X.global_transform` reads in 15 more, against only 47 bare occurrences in 7 \
files. A bare read is a node reading its own mirror, and that node is the one \
thing already guaranteed to have written the store it mirrors, so it is a \
different and much smaller question. Sorting the qualified reads into a queue \
is worth a rule; chasing 47 self-reads would make this one noise before it \
made anything correct. This rule matched 191 lines across 52 files when R3 measured \
it -- not the 190 R2's own paragraph recorded, which was one short -- 138 \
across 49 files when R4 started, 114 across 43 when R5 did, and matches 90 \
lines across the 41 files listed below now that R5 has taken flight, the last \
of navigation. All of them are exempted, plus the two line-scoped hatches in \
unit_navigation_system.gd which the file counts above do not include. See \
docs/architecture/network-multiplayer.md, phase 3's R2, R3, R4 and R5 \
paragraphs.
"""
instead = "Unit.simulation_position() or Building.simulation_position() on the node you are asking about, which answer from SimEntityState and fall back to global_position only where there is no match to be authoritative"


[[rules]]
id = "bare-class-name-reference"
zone = "all"
kind = "require-preload"
summary = "class_name used without preloading its script"
why = """
A bare global-name reference does not show up when grepping a file for its \
preloads, and when the referenced script fails to parse the failure surfaces \
somewhere unrelated — this already cost us a confusing cross-suite combat \
test failure.
"""
instead = 'const XScript := preload("res://path/to/script.gd") in this file'


[[rules]]
id = "unindexed-slice-reference"
zone = "all"
kind = "slice-index"
# Read against the scanned root, so pointing the checker at a fixture tree
# judges that tree by its own index. The reference pattern itself is in the
# checker, next to the code that splits `slice C1/C2` into two ids: the two
# have to agree exactly, and a manifest that could set them out of step would
# be a rule matching nothing.
index = "docs/architecture/slices.md"
summary = "comment cites a slice with no row in the slice index"
why = """
178 comments across scripts/, tests/ and tools/ carry their justification in a slice number, and for most of phase 3 nothing mapped a number to the change that made it -- commit subjects almost never named their own slice, and the design doc gives only 11 of 18 mentioned ids a paragraph. A number that resolves to nothing is worse than no number: it reads like a citation and costs a reader the search before they find out it is not one. docs/architecture/slices.md is that mapping, and this rule is what stops it falling behind the code that cites it -- the first comment naming a new slice fails until the slice has a row.
"""
instead = "add the slice to docs/architecture/slices.md with its commit, date and one clause, or drop the id from the comment and say what changed instead"


# ---------------------------------------------------------------------------
# Determinism rules for the simulation layer
#
# These exist because a lockstep match desyncs on a single divergent bit. They
# are proxies for the real requirement, which only the determinism property
# tests can check: identical state hashes across replays, frame rates and
# platforms.
# ---------------------------------------------------------------------------

[[rules]]
id = "sim-no-node-api"
zone = "sim"
pattern = '\b(?:get_node|get_node_or_null|get_tree|get_parent|get_viewport|add_child|remove_child|queue_free|instantiate)\s*\('
summary = "scene tree API used in the simulation"
why = "the simulation owns state; nodes are views over it. Reaching into the tree puts gameplay state where no snapshot, replay or checksum can see it"
instead = "keep the state in the sim layer and let the view read it; sim classes extend RefCounted so this API should not even be reachable"

[[rules]]
id = "sim-no-await"
zone = "sim"
pattern = '\bawait\b'
summary = "await in simulation code"
why = """
A coroutine parks state on the VM stack, invisible to snapshots, replays and \
checksums, and resumes on engine frame timing. This is the single most likely \
source of a desync in this codebase.
"""
instead = "an explicit state field advanced by the tick, so the wait is part of the simulation state"

[[rules]]
id = "sim-no-tween-or-timer"
zone = "sim"
pattern = '\b(?:create_tween|Tween\.new|Timer\.new|create_timer)\s*\(|\bSceneTreeTimer\b'
summary = "tween or timer drives simulation state"
why = "both advance on engine frame time rather than on the simulation tick, and neither is captured by a snapshot"
instead = "a tick deadline stored in sim state (`_ready_at_tick`), compared against the tick counter"

[[rules]]
id = "sim-no-signals"
zone = "sim"
pattern = '^\s*signal\s+\w+|\.(?:connect|disconnect)\s*\('
summary = "signal used in simulation code"
why = "signal dispatch order is engine-owned and the connection set is state that no snapshot captures"
instead = "return the event from the tick, or append it to an explicit event queue the caller drains"

[[rules]]
id = "sim-no-frame-delta"
zone = "sim"
pattern = '\bfunc\s+_(?:process|physics_process)\s*\(|\bdelta\s*:\s*float\b'
summary = "simulation advanced by frame time"
why = """
The engine clamps physics steps per frame, so a client that drops frames \
silently skips them and diverges. The turn scheduler owns the clock.
"""
instead = "advance_tick(tick: int), called by the turn scheduler at a fixed 25 Hz"

[[rules]]
id = "sim-no-global-rng"
zone = "sim"
pattern = '(?<!\.)\b(?:randi|randf|randi_range|randf_range|randfn|randomize|rand_from_seed)\s*\('
summary = "unseeded randomness in the simulation"
why = "global RNG is per-process state, so two clients draw different numbers from the first call onwards"
instead = "the seeded simulation RNG, whose cursor is part of the state checksum; cosmetic randomness belongs in the view layer"

[[rules]]
id = "sim-no-libm-math"
zone = "sim"
pattern = '(?<!\.)\b(?:sin|cos|tan|asin|acos|atan|atan2|sinh|cosh|tanh|pow|exp|log|fmod|fposmod)\s*\('
summary = "non-portable math function in the simulation"
why = """
IEEE-754 pins down `+ - * /` and `sqrt` on every platform, but these route \
through the platform's libm, which differs between Linux, Windows, macOS and \
WASM.
"""
instead = "SimMath, whose trigonometry runs off a generated table over integer angle units"

[[rules]]
id = "sim-no-vector-angle-math"
zone = "sim"
pattern = '\.(?:rotated|rotated_local|angle|angle_to|angle_to_point|slerp|bezier_interpolate|cubic_interpolate)\s*\('
summary = "Vector method built on non-portable math"
why = "these are libm trigonometry behind a Vector2/Vector3 method call, so they carry the same cross-platform divergence"
instead = "SimMath.rotate_units and friends; plain +, -, *, dot, length, normalized and distance_to stay portable and are fine"

[[rules]]
id = "sim-no-engine-clock"
zone = "sim"
pattern = '\bTime\.\w+|\bOS\.get_ticks_\w+|\bEngine\.get_(?:frames_drawn|process_frames|physics_frames)\b'
summary = "wall-clock or frame counter read in the simulation"
why = "any clock other than the tick counter differs between clients by construction, and differs between a live match and its replay"
instead = "the tick counter, which is the simulation's only clock"

[[rules]]
id = "sim-no-threads"
zone = "sim"
pattern = '\b(?:Thread|WorkerThreadPool|Mutex|Semaphore)\b'
summary = "threading primitive in the simulation"
why = "concurrent mutation makes the result depend on scheduling, which is the one thing no checksum can be made stable against"
instead = "keep the tick single-threaded; parallelise the view layer instead"
